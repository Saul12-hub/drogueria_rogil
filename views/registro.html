<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Droguería Rogil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 shadow" style="width: 350px;">
    <h4 class="text-center mb-3">Registro de Usuario</h4>
    
    <div class="alert alert-info text-center">
        🔹 Solo se registran usuarios con rol <strong>EMPLEADO</strong>
    </div>

    <form method="POST">
        <input type="text" name="username" class="form-control mb-2" placeholder="Usuario" required>
        <input type="password" name="password" class="form-control mb-3" placeholder="Contraseña" required>

        <button class="btn btn-primary w-100">Registrarse como Empleado</button>
    </form>

    <hr>
    <div class="text-center">
        <a href="/login">¿Ya tienes cuenta? Inicia sesión</a>
    </div>
</div>

</body>
</html>
