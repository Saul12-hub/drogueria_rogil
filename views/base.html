<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Inventario</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

<div class="d-flex">

    <div class="text-white mb-3">
    👤 {{ session['user'] }} <br>
    🔑 {{ session['rol'] }}
</div>

<a href="/logout" class="btn btn-danger btn-sm">Cerrar sesión</a>

    
    <div class="sidebar bg-dark text-white p-3">
        <h4>Farmacia</h4>
        <ul class="nav flex-column">
         <li><a href="{{ url_for('productos') }}" class="nav-link text-white">Productos</a></li>
         <li><a href="{{ url_for('ventas') }}" class="nav-link text-white">Ventas</a></li>
        <li><a href="{{ url_for('inventario') }}" class="nav-link text-white">Inventario</a></li>
        <li><a href="{{ url_for('devoluciones') }}" class="nav-link text-white">Ajustes</a></li>
        <li><a href="{{ url_for('proveedores') }}" class="nav-link text-white">Proveedores</a></li>
        <li><a href="{{ url_for('alertas') }}" class="nav-link text-white">Alertas</a></li>
        </ul>
    </div>

    <!-- CONTENIDO -->
    <div class="content p-4 w-100">
        {% block content %}{% endblock %}
    </div>

</div>

<script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</body>
</html>
