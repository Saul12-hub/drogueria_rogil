<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Inventario</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

<div class="main-container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <!-- Logo -->
        <div class="sidebar-header">
            <div class="logo-circle">
                <i class="bi bi-capsule-pill"></i>
            </div>

            <h2>Farmacia</h2>
            <p>Sistema Rogil</p>
        </div>

        <!-- Usuario -->
        <div class="user-card">
            <i class="bi bi-person-circle"></i>

            <div>
                <h5>{{ session['user'] }}</h5>
                <span>{{ session['rol'] }}</span>
            </div>
        </div>

        <!-- Menú -->
        <nav class="menu">

            <a href="{{ url_for('productos.productos') }}" class="menu-item">
                <i class="bi bi-capsule"></i>
                <span>Productos</span>
            </a>

            <a href="{{ url_for('ventas.ventas') }}" class="menu-item">
                <i class="bi bi-cart"></i>
                <span>Ventas</span>
            </a>

            <a href="{{ url_for('inventario.inventario') }}" class="menu-item">
                <i class="bi bi-box-seam"></i>
                <span>Inventario</span>
            </a>

            <a href="{{ url_for('devoluciones') }}" class="menu-item">
                <i class="bi bi-arrow-left-right"></i>
                <span>Ajustes</span>
            </a>

            <a href="{{ url_for('proveedores') }}" class="menu-item">
                <i class="bi bi-truck"></i>
                <span>Proveedores</span>
            </a>

            <a href="{{ url_for('alertas.alertas') }}" class="menu-item">
                <i class="bi bi-exclamation-triangle"></i>
                <span>Alertas</span>
            </a>

        </nav>

        <!-- Logout -->
        <div class="logout-container">
            <a href="/logout" class="logout-btn">
                <i class="bi bi-box-arrow-left"></i>
                Cerrar sesión
            </a>
        </div>

    </aside>

    <!-- CONTENIDO -->
    <main class="content">
        {% block content %}{% endblock %}
    </main>

</div>

<script src="{{ url_for('static', filename='js/scripts.js') }}"></script>

</body>
</html>
